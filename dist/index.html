<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NPC WORLD - TikTok LIVE 3D Interactive City</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-glass: rgba(13, 17, 23, 0.72);
      --bg-glass-card: rgba(22, 27, 34, 0.78);
      --border-glass: rgba(255, 255, 255, 0.12);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-neon: #38bdf8;
      --accent-gold: #fbbf24;
      --accent-rose: #f43f5e;
      --accent-green: #34d399;
      --shadow-soft: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      font-family: 'Outfit', -apple-system, sans-serif;
      color: var(--text-main);
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* HUD Overlay */
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      transition: opacity 0.3s ease;
    }

    /* Top Bar */
    .hud-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .city-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      padding: 10px 20px;
      border-radius: 999px;
      box-shadow: var(--shadow-soft);
    }

    .city-logo {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(244, 63, 94, 0.2);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fb7185;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #f43f5e;
      border-radius: 50%;
      animation: pulse-dot 1.4s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .city-metrics {
      display: flex;
      gap: 16px;
    }

    .metric-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-soft);
    }

    .metric-value {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: #fff;
    }

    /* Live Feed Container */
    .hud-feed-container {
      position: absolute;
      left: 24px;
      bottom: 24px;
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .feed-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-glass-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      padding: 12px 16px;
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      animation: slide-in 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      transition: all 0.3s ease;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateX(-30px) scale(0.95); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    .feed-card.highlight {
      border-color: rgba(251, 191, 36, 0.6);
      background: rgba(30, 35, 45, 0.88);
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.25);
    }

    .feed-card.legendary {
      border-color: rgba(244, 63, 94, 0.8);
      background: rgba(40, 15, 25, 0.92);
      box-shadow: 0 0 25px rgba(244, 63, 94, 0.4);
    }

    .feed-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .feed-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .feed-user {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-neon);
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    .feed-text {
      font-size: 12px;
      color: var(--text-main);
      line-height: 1.3;
    }

    /* Right Leaderboard */
    .hud-leaderboard {
      position: absolute;
      right: 24px;
      bottom: 24px;
      width: 260px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow-soft);
    }

    .leaderboard-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-gold);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .leaderboard-item:last-child {
      border-bottom: none;
    }

    .leaderboard-rank {
      font-weight: 700;
      color: var(--text-muted);
      width: 20px;
    }

    .leaderboard-name {
      flex: 1;
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .leaderboard-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--accent-green);
    }

    /* Cinematic Banner for Epic Events */
    #epic-banner {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(-50px);
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.9), rgba(147, 51, 234, 0.9));
      backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      padding: 16px 36px;
      border-radius: 999px;
      box-shadow: 0 0 50px rgba(220, 38, 38, 0.6);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    #epic-banner.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #epic-banner-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #epic-banner-desc {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 2px;
    }

    /* Dev & Admin Floating Panel */
    #dev-panel {
      position: absolute;
      top: 80px;
      right: 24px;
      width: 320px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 16px;
      z-index: 20;
      box-shadow: var(--shadow-soft);
      display: none;
      pointer-events: auto;
    }

    .dev-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-neon);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dev-stats {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .dev-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .dev-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border-glass);
      color: #fff;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .dev-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-neon);
    }

    .dev-input-group {
      display: flex;
      gap: 6px;
    }

    .dev-input {
      flex: 1;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border-glass);
      padding: 6px 10px;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    /* OBS Mode Adjustments */
    body.mode-obs #dev-panel,
    body.mode-obs .dev-toggle-btn {
      display: none !important;
    }

    body.mode-vertical #hud-overlay {
      max-width: 600px;
      margin: 0 auto;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-lSqXe-dE.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- HUD Overlay -->
  <div id="hud-overlay">
    <!-- Top Bar -->
    <header class="hud-topbar">
      <div class="city-badge">
        <span class="city-logo">🌆 NPC WORLD</span>
        <div class="live-indicator">
          <span class="live-dot"></span>
          LIVE
        </div>
      </div>

      <div class="city-metrics">
        <div class="metric-pill">
          <span>🕒</span>
          <span id="metric-clock" class="metric-value">09:30</span>
        </div>
        <div class="metric-pill">
          <span>🌦️</span>
          <span id="metric-weather" class="metric-value">Ensolarado</span>
        </div>
        <div class="metric-pill">
          <span>👥</span>
          <span id="metric-population" class="metric-value">32 moradores</span>
        </div>
        <div class="metric-pill">
          <span>💰</span>
          <span id="metric-economy" class="metric-value">$124.500</span>
        </div>
      </div>
    </header>

    <!-- Epic Event Banner -->
    <div id="epic-banner">
      <div id="epic-banner-title">☄️ ALERTA: METEORO SE APROXIMANDO!</div>
      <div id="epic-banner-desc">Todos os cidadãos em alerta máximo!</div>
    </div>

    <!-- Live Event Feed -->
    <div id="hud-feed-container" class="hud-feed-container"></div>

    <!-- Leaderboard / Top Supporters -->
    <div class="hud-leaderboard">
      <div class="leaderboard-title">🏆 Top Cidadãos da Live</div>
      <div id="leaderboard-list" class="leaderboard-list">
        <div class="leaderboard-item">
          <span class="leaderboard-rank">1</span>
          <span class="leaderboard-name">@joao_stream</span>
          <span class="leaderboard-val">$4.250</span>
        </div>
        <div class="leaderboard-item">
          <span class="leaderboard-rank">2</span>
          <span class="leaderboard-name">@maria_gamer</span>
          <span class="leaderboard-val">$2.890</span>
        </div>
        <div class="leaderboard-item">
          <span class="leaderboard-rank">3</span>
          <span class="leaderboard-name">@pedro99</span>
          <span class="leaderboard-val">$1.500</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Dev Panel Floating Window -->
  <div id="dev-panel">
    <div class="dev-title">
      <span>🛠️ PAINEL ADMIN / DEV</span>
      <span id="dev-fps" style="font-family: monospace; color: #34d399;">60 FPS</span>
    </div>
    <div id="dev-stats" class="dev-stats">
      NPCs: 0 | Carros: 0 | WebSocket: Conectando...
    </div>
    <div class="dev-buttons">
      <button class="dev-btn" id="btn-gift-rose">🌹 Rosa (Flor)</button>
      <button class="dev-btn" id="btn-gift-galaxy">🌌 Galáxia</button>
      <button class="dev-btn" id="btn-meteor">☄️ Meteoro</button>
      <button class="dev-btn" id="btn-police">🚨 Polícia</button>
      <button class="dev-btn" id="btn-rain">🌧️ Chuva</button>
      <button class="dev-btn" id="btn-storm">⛈️ Tempestade</button>
      <button class="dev-btn" id="btn-race">🏎️ Corrida</button>
      <button class="dev-btn" id="btn-festival">🎆 Festival</button>
      <button class="dev-btn" id="btn-blackout">💡 Apagão</button>
      <button class="dev-btn" id="btn-resident">👤 Morador</button>
      <button class="dev-btn" id="btn-likes">❤️ +50 Likes</button>
      <button class="dev-btn" id="btn-toggle-time">☀️/🌙 Dia/Noite</button>
    </div>
    <div class="dev-input-group">
      <input type="text" id="dev-chat-input" class="dev-input" placeholder="Comando: rosa, policia, meteoro, chuva..." />
      <button class="dev-btn" id="btn-send-chat">Enviar</button>
    </div>
  </div>

</body>
</html>
